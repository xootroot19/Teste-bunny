      - name: Analisar, testar e compilar as duas arquiteturas
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUNNY_PROJECT_DIR"
          flutter config --no-analytics
          bash scripts/build-apk.sh
      - name: Verificar assinatura e preparar download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/entrega"
          cp "$BUNNY_PROJECT_DIR/bunnymodels-demo-universal.apk" "$GITHUB_WORKSPACE/entrega/"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$GITHUB_WORKSPACE/entrega/bunnymodels-demo-universal.apk" > "$GITHUB_WORKSPACE/entrega/assinatura.txt"
          cd "$GITHUB_WORKSPACE/entrega"
          sha256sum bunnymodels-demo-universal.apk > SHA256.txt
      - name: Baixar APK aqui
        uses: actions/upload-artifact@v4
        with:
          name: APK-bunnymodels
          path: entrega/
          if-no-files-found: error
          retention-days: 30
      - name: Mostrar instruções de instalação
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'INFO'
          ## Seu APK está pronto
          Abra **Artifacts** nesta execução e baixe **APK-bunnymodels**.
          Extraia o ZIP e instale **bunnymodels-demo-universal.apk** no Android.
          O arquivo contém ARM 32 e 64 bits. Senha inicial: **2468**.
          INFO
